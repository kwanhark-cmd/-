name: 빌드와 테스트

# push 할 때마다 테스트를 돌리고, 윈도우·맥·안드로이드·리눅스 설치 파일을 만든다.
# 버전 태그(v1.2.0 처럼)를 올리면 GitHub Releases 에 설치 파일과 변경 내역을 공개한다.
# 서명 키·비밀 값은 쓰지 않는다. 안드로이드 설치 파일도 언제나 함께 공개한다.
# 앱 안의 "업데이트 확인" 이 이 공개본을 읽는다.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Actions 화면의 "Run workflow" 에서 "새 버전 공개"를 고르면, 앱 버전(pubspec.yaml)으로
  # 태그(v1.2.0 등)를 만들고 Releases 에 공개한다 (태그를 직접 올리기 어려울 때).
  workflow_dispatch:
    inputs:
      release:
        description: '새 버전 공개 (GitHub Releases)'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: 검사와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 형식 검사
        run: dart format --output=none --set-exit-if-changed lib test
      - name: 정적 검사
        run: flutter analyze --fatal-infos
      - name: 단위·흐름 테스트
        run: flutter test

  linux:
    name: 리눅스
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
        working-directory: .
      - run: flutter build linux --release
      - run: tar -czf build/channel-biseo-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-리눅스
          path: app/build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: app/build/channel-biseo-linux.tar.gz

  windows:
    name: 윈도우
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-윈도우
          path: app/build/windows/x64/runner/Release
      - name: 설치 프로그램 만들기
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: app/build/channel-biseo-windows-setup.exe

  macos:
    name: 맥
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: 압축
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/channel_biseo.app" "build/channel-biseo-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-맥
          path: app/build/channel-biseo-macos.zip

  android:
    name: 안드로이드
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 서명 키는 쓰지 않는다 (주인 결정). 안드로이드 새 버전은 백업 → 예전 앱 삭제 → 설치 → 복원.
      # 가끔 내려받기 문제로 실패해서 한 번만 다시 시도한다.
      - name: 안드로이드 설치 파일 만들기
        run: flutter build apk --release || { echo "한 번 더 시도"; sleep 20; flutter build apk --release; }
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/channel-biseo-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-안드로이드
          path: app/build/channel-biseo-android.apk

  release:
    name: 새 버전 공개 (GitHub Releases)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 버전 정하기 (태그와 앱 버전이 같은지 확인)
        run: |
          app=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[ ]*([0-9.]+).*/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag=${GITHUB_REF_NAME#v}
            echo "앱 $app / 태그 $tag"
            test "$app" = "$tag"
          fi
          echo "VER=$app" >> "$GITHUB_ENV"
      - name: 이번 버전 변경 내역 뽑기
        run: |
          ver=$VER
          # 맨 위는 안드로이드 순서 (이미 설치된 앱의 업데이트 창은 이 글의 맨 위부터 보여 준다).
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## 안드로이드 새 버전으로 바꾸는 순서 (꼭 이 순서대로)
          안드로이드는 예전 앱을 지우고 새로 설치해요. 앱을 지우면 앱 안의 자료도 모두 지워지니 백업이 먼저예요.
          1. 지금 쓰는 앱에서 설정 → 자료 관리 → "백업 만들기"를 눌러, 백업 파일을 휴대폰의 "다운로드" 폴더처럼 앱 밖에 저장해요.
          2. 휴대폰의 "파일"(내 파일) 앱에서 다운로드 폴더에 백업 파일(채널비서-백업-….sqlite)이 있는지 확인해요. 저장된 곳에 "com.channelbiseo" 나 "Android/data" 가 들어 있으면 앱 안이라 지우면 사라져요. 다시 "다운로드" 폴더를 골라 백업해 주세요.
          3. 아래 Assets 에서 channel-biseo-android.apk 를 받아요. (앱 안의 "설치하기"는 안드로이드에서는 되지 않아요)
          4. 예전 앱을 지워요. (1·2번을 먼저 했는지 꼭 확인!)
          5. 받은 apk 를 열어 설치해요.
          6. 새 앱에서 사용자를 만들고, 첫 실행 안내의 "백업에서 복원"(또는 설정 → 자료 관리)으로 1번 백업 파일을 골라요.
          7. 구글 연결과 인공지능 연결 열쇠는 다시 넣어 주세요.

          NOTES
          awk -v v="## $ver" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md >> "$RUNNER_TEMP/notes.md"
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          ---
          윈도우: channel-biseo-windows-setup.exe 를 받아 실행하면 같은 자리에 설치돼요. 자료는 그대로예요. (앱의 설정 → "업데이트 확인" → "설치하기"로도 돼요)
          맥: channel-biseo-macos.zip 을 받아 풀고, 응용 프로그램 폴더의 예전 앱을 새 앱으로 바꿔요. 자료는 그대로예요.
          리눅스: channel-biseo-linux.tar.gz 를 받아 풀고, 예전 폴더를 새 것으로 바꿔요. 자료는 그대로예요.
          NOTES
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/out
      - name: 공개
        uses: softprops/action-gh-release@v2
        with:
          name: 채널관리비서 v${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: ${{ runner.temp }}/notes.md
          files: |
            ${{ runner.temp }}/out/release-windows/channel-biseo-windows-setup.exe
            ${{ runner.temp }}/out/채널비서-맥/channel-biseo-macos.zip
            ${{ runner.temp }}/out/채널비서-안드로이드/channel-biseo-android.apk
            ${{ runner.temp }}/out/release-linux/channel-biseo-linux.tar.gz
