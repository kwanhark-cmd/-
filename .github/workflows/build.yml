name: 빌드와 테스트

# push 할 때마다 테스트를 돌리고, 윈도우·맥·안드로이드·리눅스 설치 파일을 만든다.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: 검사와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 형식 검사
        run: dart format --output=none --set-exit-if-changed lib test
      - name: 정적 검사
        run: flutter analyze --fatal-infos
      - name: 단위·흐름 테스트
        run: flutter test

  linux:
    name: 리눅스
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
        working-directory: .
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-리눅스
          path: app/build/linux/x64/release/bundle

  windows:
    name: 윈도우
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-윈도우
          path: app/build/windows/x64/runner/Release

  macos:
    name: 맥
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: 압축
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/channel_biseo.app" "build/채널비서-맥.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-맥
          path: app/build/채널비서-맥.zip

  android:
    name: 안드로이드
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-안드로이드
          path: app/build/app/outputs/flutter-apk/app-release.apk
