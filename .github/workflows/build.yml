name: 빌드와 테스트

# push 할 때마다 테스트를 돌리고, 윈도우·맥·안드로이드·리눅스 설치 파일을 만든다.
# 버전 태그(v1.2.0 처럼)를 올리면 GitHub Releases 에 설치 파일과 변경 내역을 공개한다.
# 앱 안의 "업데이트 확인" 이 이 공개본을 읽는다.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Actions 화면의 "Run workflow" 에서 "새 버전 공개"를 고르면, 앱 버전(pubspec.yaml)으로
  # 태그(v1.2.0 등)를 만들고 Releases 에 공개한다 (태그를 직접 올리기 어려울 때).
  workflow_dispatch:
    inputs:
      release:
        description: '새 버전 공개 (GitHub Releases)'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: 검사와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 형식 검사
        run: dart format --output=none --set-exit-if-changed lib test
      - name: 정적 검사
        run: flutter analyze --fatal-infos
      - name: 단위·흐름 테스트
        run: flutter test

  linux:
    name: 리눅스
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
        working-directory: .
      - run: flutter build linux --release
      - run: tar -czf build/channel-biseo-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-리눅스
          path: app/build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: app/build/channel-biseo-linux.tar.gz

  windows:
    name: 윈도우
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-윈도우
          path: app/build/windows/x64/runner/Release
      - name: 설치 프로그램 만들기
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: app/build/channel-biseo-windows-setup.exe

  macos:
    name: 맥
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: 압축
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/channel_biseo.app" "build/channel-biseo-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-맥
          path: app/build/channel-biseo-macos.zip

  android:
    name: 안드로이드
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 서명 키 준비 (있을 때만)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::안드로이드 서명 키가 없어 테스트용 서명으로 만듭니다. 이 경우 업데이트 설치가 안 될 수 있어요 (README 참고)."
          fi
      - run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/channel-biseo-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 채널비서-안드로이드
          path: app/build/channel-biseo-android.apk

  release:
    name: 새 버전 공개 (GitHub Releases)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 버전 정하기 (태그와 앱 버전이 같은지 확인)
        run: |
          app=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[ ]*([0-9.]+).*/\1/')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag=${GITHUB_REF_NAME#v}
            echo "앱 $app / 태그 $tag"
            test "$app" = "$tag"
          fi
          echo "VER=$app" >> "$GITHUB_ENV"
      - name: 이번 버전 변경 내역 뽑기
        run: |
          ver=$VER
          awk -v v="## $ver" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\n---\n새 버전 설치 = 앱 파일 덮어쓰기, 설정은 유지됨. 앱의 설정 → "업데이트 확인" 으로도 설치할 수 있어요.\n' >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/out
      - name: 공개
        uses: softprops/action-gh-release@v2
        with:
          name: 채널관리비서 v${{ env.VER }}
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: ${{ runner.temp }}/notes.md
          files: |
            ${{ runner.temp }}/out/release-windows/channel-biseo-windows-setup.exe
            ${{ runner.temp }}/out/채널비서-맥/channel-biseo-macos.zip
            ${{ runner.temp }}/out/채널비서-안드로이드/channel-biseo-android.apk
            ${{ runner.temp }}/out/release-linux/channel-biseo-linux.tar.gz
